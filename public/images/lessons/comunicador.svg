<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Una tarjeta también puede dar voz</title><desc id="d">Lámina educativa: Pedir · Elegir · Rechazar. Tres pasos visuales: Elegir una tarjeta, Expresar una necesidad, Respetar el mensaje.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f2f1"/><stop offset="1" stop-color="#fff"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#34445c" flood-opacity=".13"/></filter></defs><rect width="960" height="560" rx="30" fill="url(#g)"/><circle cx="865" cy="90" r="130" fill="#fff" opacity=".42"/><circle cx="85" cy="300" r="105" fill="#fff" opacity=".34"/><text x="48" y="55" fill="#39847c" font-size="14" font-weight="800" letter-spacing="3" font-family="Arial,sans-serif">JAIRRESTAURA NEURO · APRENDER PARA ACOMPAÑAR</text><text x="48" y="104" fill="#273449" font-size="34" font-weight="800" font-family="Arial,sans-serif">Una tarjeta también puede dar voz</text><text x="50" y="136" fill="#5c6879" font-size="18" font-family="Arial,sans-serif">Pedir · Elegir · Rechazar</text><g filter="url(#s)"><rect x="48" y="166" width="864" height="222" rx="26" fill="#fff" opacity=".9"/></g><g transform="translate(100 184)"><circle cx="138" cy="95" r="88" fill="#e0f2f1"/><circle cx="138" cy="95" r="68" fill="#fff" opacity=".78"/><text x="138" y="130" text-anchor="middle" font-size="105">🗣️</text><circle cx="58" cy="28" r="22" fill="#39847c" opacity=".16"/><text x="58" y="37" text-anchor="middle" font-size="24">💧</text><circle cx="224" cy="158" r="22" fill="#39847c" opacity=".16"/><text x="224" y="167" text-anchor="middle" font-size="24">🍎</text></g><g transform="translate(430 193)"><text x="0" y="20" fill="#39847c" font-size="14" font-weight="800" letter-spacing="2" font-family="Arial,sans-serif">IDEA CLAVE</text><text x="0" y="62" fill="#273449" font-size="25" font-weight="700" font-family="Arial,sans-serif">Elegir una tarjeta</text><path d="M0 82 H410" stroke="#e0f2f1" stroke-width="5" stroke-linecap="round"/><text x="0" y="116" fill="#586579" font-size="18" font-family="Arial,sans-serif">Expresar una necesidad</text><text x="0" y="150" fill="#586579" font-size="18" font-family="Arial,sans-serif">Respetar el mensaje</text><rect x="0" y="169" width="390" height="34" rx="17" fill="#e0f2f1"/><text x="18" y="192" fill="#39847c" font-size="14" font-weight="700" font-family="Arial,sans-serif">Cada persona es única. Pregunta y escucha.</text></g><g transform="translate(46,416)"><rect width="268" height="92" rx="20" fill="#fff" opacity=".94"/><circle cx="43" cy="45" r="26" fill="#e0f2f1"/><text x="43" y="54" text-anchor="middle" font-size="28">💧</text><text x="82" y="39" fill="#344054" font-size="18" font-weight="700">Elegir una tarjeta</text><text x="82" y="63" fill="#687386" font-size="14">Comprender</text></g><g transform="translate(342,416)"><rect width="268" height="92" rx="20" fill="#fff" opacity=".94"/><circle cx="43" cy="45" r="26" fill="#e0f2f1"/><text x="43" y="54" text-anchor="middle" font-size="28">🍎</text><text x="82" y="39" fill="#344054" font-size="18" font-weight="700">Expresar una necesidad</text><text x="82" y="63" fill="#687386" font-size="14">Practicar</text></g><g transform="translate(638,416)"><rect width="268" height="92" rx="20" fill="#fff" opacity=".94"/><circle cx="43" cy="45" r="26" fill="#e0f2f1"/><text x="43" y="54" text-anchor="middle" font-size="28">✋</text><text x="82" y="39" fill="#344054" font-size="18" font-weight="700">Respetar el mensaje</text><text x="82" y="63" fill="#687386" font-size="14">Acompañar</text></g><text x="480" y="540" text-anchor="middle" fill="#788397" font-size="12" letter-spacing="2" font-family="Arial,sans-serif">COMPRENDER · RESPETAR · ACOMPAÑAR</text></svg>